name: Calgary skating weekly update

on:
  schedule:
    - cron: "0 14 * * 0"   # every Sunday 14:00 UTC (7-8 AM Calgary)
  workflow_dispatch:        # manual run from the Actions tab

permissions:
  contents: write           # lets the job commit docs/skating.ics

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Build calendar + send Telegram digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # FACILITY_FILTER: "southland,murray"   # optional: only these arenas
          # DAYS_AHEAD: "14"
        run: python bot.py
      - name: Commit calendar file
        run: |
          git config user.name "skate-bot"
          git config user.email "skate-bot@users.noreply.github.com"
          git add docs/skating.ics
          git diff --cached --quiet || git commit -m "Update skating calendar"
          git push
      - name: Upload debug dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-dump
          path: debug_dump.json
          if-no-files-found: ignore
